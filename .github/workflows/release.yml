name: Publish public starter release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate showcase
        run: python scripts/validate_showcase.py
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -qr "dist/UGC_Ninja_Agent_Starter_${VERSION}.zip" . -x '.git/*' 'dist/*'
          tar -czf "dist/UGC_Ninja_Agent_Starter_${VERSION}.tar.gz" --exclude='.git' --exclude='./dist' .
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/UGC_Ninja_Agent_Starter_${VERSION}.zip" \
            "dist/UGC_Ninja_Agent_Starter_${VERSION}.tar.gz" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "UGC Ninja Agent Starter ${VERSION}" \
            --notes-file RELEASE_NOTES.md
